<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BiharBoardStudy</title>

    <script>
      (function () {
        var l = window.location;

        var redirect =
          l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          "/?/" +
          l.pathname.slice(1) +
          (l.search
            ? "&" + l.search.slice(1).replace(/&/g, "~and~")
            : "") +
          l.hash;

        window.location.replace(redirect);
      })();
    </script>
  </head>

  <body>
    <p>Loading BiharBoardStudy...</p>
  </body>
</html>
